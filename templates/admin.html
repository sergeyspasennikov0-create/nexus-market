{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-box" style="max-width: 600px;">
        <h2>⚙️ Панель Администратора</h2>
        <p class="auth-subtitle">Добавление нового товара в NEXUS Market</p>
        
        <form method="POST" action="/add_product">
            <input type="text" name="title" placeholder="Название товара" required>
            <input type="text" name="description" placeholder="Краткое описание" required>
            <input type="number" name="price" placeholder="Цена (в рублях)" required>
            <input type="text" name="icon" placeholder="Иконка (например: 🎮 или 🥽)" required maxlength="2">
            
            <button type="submit" class="btn-primary full-width">Добавить товар на сайт</button>
        </form>
    </div>
</div>
{% endblock %}
